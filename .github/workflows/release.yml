name: Build and Publish Release

on:
  release:
    types: [published]

  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Foundry Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          submodules: false

      - name: Read module metadata
        id: module
        shell: bash
        run: |
          MODULE_ID="$(jq -r '.id' module.json)"
          VERSION="$(jq -r '.version' module.json)"

          if [ -z "$MODULE_ID" ] || [ "$MODULE_ID" = "null" ]; then
            echo "::error::module.json contains no valid id."
            exit 1
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::module.json contains no valid version."
            exit 1
          fi

          echo "id=$MODULE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=${MODULE_ID}.zip" >> "$GITHUB_OUTPUT"

          echo "Module ID: $MODULE_ID"
          echo "Version:   $VERSION"
          echo "ZIP:       ${MODULE_ID}.zip"

      - name: Build module ZIP
        shell: bash
        run: |
          ZIP_NAME="${{ steps.module.outputs.zip }}"

          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x ".gitmodules" \
            -x ".DS_Store" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "reference/*" \
            -x "*.zip"

          echo
          echo "Created $ZIP_NAME"
          ls -lah "$ZIP_NAME"

          echo
          echo "ZIP contents:"
          unzip -l "$ZIP_NAME"

          echo
          echo "Checking that development files are excluded..."

          if unzip -l "$ZIP_NAME" | grep -qE 'reference/|\.gitmodules'; then
            echo "::error::Reference/submodule files were included in the release ZIP."
            exit 1
          fi

          echo "Reference files successfully excluded."

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ steps.module.outputs.version }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create release if necessary
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            echo "Creating release $TAG_NAME..."

            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Upload module ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          ZIP_NAME: ${{ steps.module.outputs.zip }}
        shell: bash
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::ZIP file $ZIP_NAME does not exist."
            exit 1
          fi

          echo "Uploading $ZIP_NAME to release $TAG_NAME..."

          gh release upload \
            "$TAG_NAME" \
            "$ZIP_NAME" \
            --clobber

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          ZIP_NAME: ${{ steps.module.outputs.zip }}
        shell: bash
        run: |
          echo "Release assets:"

          gh release view "$TAG_NAME" \
            --json assets \
            --jq '.assets[].name'

          if ! gh release view "$TAG_NAME" \
            --json assets \
            --jq '.assets[].name' | grep -Fxq "$ZIP_NAME"; then
            echo "::error::Expected release asset $ZIP_NAME was not found."
            exit 1
          fi

          echo "Verified release asset: $ZIP_NAME"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Foundry Module Release"
            echo
            echo "- **Module:** \`${{ steps.module.outputs.id }}\`"
            echo "- **Version:** \`${{ steps.module.outputs.version }}\`"
            echo "- **Tag:** \`${{ steps.release.outputs.tag }}\`"
            echo "- **Asset:** \`${{ steps.module.outputs.zip }}\`"
            echo "- **PF2e reference submodule:** excluded"
          } >> "$GITHUB_STEP_SUMMARY"
